<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulSeek - Mood Playlist Generator</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <div class="logo-icon">
                <i data-lucide="music"></i>
            </div>
            <h1>SoulSeek</h1>
        </div>
        <div class="scan-controls">
            <button class="secondary" id="scan-btn">
                <i data-lucide="folder-search"></i>
                Scan Library
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Generator Panel -->
        <section class="generator-panel">
            <input type="text" id="prompt-input" placeholder="Describe a mood (e.g., 'Sad songs for a rainy day')..." autocomplete="off">
            <button class="primary" id="generate-btn">
                <i data-lucide="wand-2"></i>
                Generate Playlist
            </button>
        </section>

        <!-- Results / Queue -->
        <section id="results-area">
            <div class="song-headers song-item">
                <span class="index">#</span>
                <span class="title">Title</span>
                <span class="album">Album</span>
                <span class="bpm">Arousal</span>
                <span class="bpm">Valence</span>
                <span class="score">Match</span>
                <span class="duration">Time</span>
            </div>
            <div id="song-list" class="song-list">
                <!-- Songs will be injected here -->
                <div class="empty-state">
                    <i data-lucide="music-2"></i>
                    <p>Generate a playlist to see songs here.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Player Bar -->
    <footer class="player-bar">
        <!-- Song Info -->
        <div class="now-playing">
            <div class="now-playing-info">
                <div class="now-playing-title" id="np-title">No Song Selected</div>
                <div class="now-playing-artist" id="np-artist">-</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="player-controls">
            <div class="control-buttons">
                <button class="control-btn" id="shuffle-btn" title="Shuffle">
                    <i data-lucide="shuffle"></i>
                </button>
                <button class="control-btn" id="prev-btn" title="Previous">
                    <i data-lucide="skip-back"></i>
                </button>
                <button class="control-btn play-pause" id="play-pause-btn" title="Play/Pause">
                    <i data-lucide="play"></i>
                </button>
                <button class="control-btn" id="next-btn" title="Next">
                    <i data-lucide="skip-forward"></i>
                </button>
                <button class="control-btn" id="repeat-btn" title="Repeat">
                    <i data-lucide="repeat"></i>
                </button>
            </div>
            
            <!-- Progress -->
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <span id="duration">0:00</span>
            </div>
        </div>

        <!-- Volume -->
        <div class="volume-controls">
            <i data-lucide="volume-2"></i>
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
        </div>
    </footer>

    <!-- Scan Modal -->
    <div id="scan-modal" class="modal-overlay hidden">
        <div class="modal-content scan-modal">
            <h2>Scan Library</h2>
            <p>Enter the absolute path to your music folder.</p>
            <input type="text" id="scan-path-input" placeholder="/home/user/Music">
            
            <!-- Progress Section -->
            <div id="scan-progress" class="scan-progress hidden">
                <div class="progress-header">
                    <span class="stage" id="scan-stage">Preparing...</span>
                    <span class="percent" id="scan-percent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div id="scan-progress-bar" class="progress-bar-fill" style="width: 0%"></div>
                </div>
                <div id="scan-current-file" class="scan-current-file"></div>
                <div class="progress-stats">
                    <span id="scan-count">0 / 0 files</span>
                    <span id="scan-timer">--:-- elapsed</span>
                </div>
                <div class="progress-stats">
                    <span id="scan-songs-total">Total indexed: 0</span>
                    <span id="scan-eta">ETA: --:--</span>
                </div>
            </div>
            
            <div class="modal-buttons">
                <button class="secondary" id="cancel-scan-btn">
                    <i data-lucide="x"></i>
                    Cancel
                </button>
                <button class="primary" id="confirm-scan-btn">
                    <i data-lucide="search"></i>
                    Start Scan
                </button>
            </div>
            <div id="scan-status"></div>
        </div>
    </div>

    <!-- Audio Element (Hidden) -->
    <audio id="audio-player"></audio>

    <script src="/static/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
